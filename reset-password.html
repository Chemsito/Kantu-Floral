<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,follow">
    <title>Nueva contraseña | Kantu Floral</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;">
        <div class="modal" style="width:100%;max-width:460px;">
            <div id="resetPasswordForm">
                <div style="text-align:center;margin-bottom:30px;">
                    <div style="font-size:48px;margin-bottom:10px;" aria-hidden="true">🌸</div>
                    <h1 style="font-size:2rem;">Nueva contraseña</h1>
                    <p class="modal-subtitle">Crea una nueva contraseña para tu cuenta de Kantu Floral.</p>
                </div>

                <form id="newPasswordForm">
                    <div class="form-group">
                        <label for="newPassword">Nueva contraseña</label>
                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Mínimo 8 caracteres"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirmNewPassword">Confirmar contraseña</label>
                        <input
                            type="password"
                            id="confirmNewPassword"
                            placeholder="Repite tu contraseña"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary form-submit">Cambiar contraseña</button>
                </form>

                <p id="resetMessage" role="status" aria-live="polite" style="text-align:center;margin-top:20px;"></p>

                <div style="text-align:center;margin-top:25px;">
                    <a href="index.html">← Volver a Kantu Floral</a>
                </div>
            </div>
        </div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
    <script src="js/supabase.js"></script>
    <script>
        const MIN_PASSWORD_LENGTH = 8;
        const form = document.getElementById("newPasswordForm");
        const message = document.getElementById("resetMessage");

        form.addEventListener("submit", async event => {
            event.preventDefault();

            const password = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmNewPassword").value;

            if (password.length < MIN_PASSWORD_LENGTH) {
                message.textContent = `La contraseña debe tener al menos ${MIN_PASSWORD_LENGTH} caracteres.`;
                return;
            }

            if (password !== confirmPassword) {
                message.textContent = "Las contraseñas no coinciden.";
                return;
            }

            message.textContent = "Actualizando contraseña...";

            const { error } = await supabaseClient.auth.updateUser({ password });

            if (error) {
                console.error("Error actualizando contraseña:", error);
                message.textContent = "No se pudo actualizar la contraseña. Solicita un nuevo enlace si este ya expiró.";
                return;
            }

            message.textContent = "¡Contraseña actualizada correctamente! 🌸";
            form.reset();
            setTimeout(() => { window.location.href = "index.html"; }, 2500);
        });
    </script>
</body>
</html>
