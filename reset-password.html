<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff8f4">
    <meta name="robots" content="noindex,nofollow">
    <link rel="icon" href="assets/brand/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/brand/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/brand/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <title>Nueva contraseña | Kantu Floral</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/brand-experience.css" data-kantu-brand-experience="true">
    <link rel="stylesheet" href="css/reset-password.css">
</head>
<body class="reset-password-page">
    <main class="reset-shell">
        <section class="reset-card" aria-labelledby="resetTitle">
            <header class="reset-brand">
                <div class="reset-brand-mark" aria-hidden="true"><img src="assets/brand/kantu-mark-512.png" alt=""></div>
                <h1 id="resetTitle">Nueva contraseña</h1>
                <p>Crea una nueva contraseña para tu cuenta de Kantu Floral.</p>
            </header>

            <p id="resetAccessState" class="reset-access-state" role="status" aria-live="polite">Verificando el enlace de recuperación…</p>

            <form id="newPasswordForm" class="reset-form" hidden>
                <div class="reset-field">
                    <label for="newPassword">Nueva contraseña</label>
                    <div class="reset-password-control">
                        <input type="password" id="newPassword" placeholder="Mínimo 8 caracteres" minlength="8" autocomplete="new-password" required>
                        <button type="button" class="reset-password-toggle" data-password-toggle="newPassword" aria-pressed="false">Mostrar</button>
                    </div>
                    <div id="resetStrength" class="reset-strength" data-strength="">
                        <div class="reset-strength-track" aria-hidden="true"><div class="reset-strength-fill"></div></div>
                        <small id="resetStrengthLabel">Usa al menos 8 caracteres.</small>
                    </div>
                </div>

                <div class="reset-field">
                    <label for="confirmNewPassword">Confirmar contraseña</label>
                    <div class="reset-password-control">
                        <input type="password" id="confirmNewPassword" placeholder="Repite tu contraseña" minlength="8" autocomplete="new-password" required>
                        <button type="button" class="reset-password-toggle" data-password-toggle="confirmNewPassword" aria-pressed="false">Mostrar</button>
                    </div>
                </div>

                <button id="resetSubmit" type="submit" class="reset-submit">Cambiar contraseña</button>
                <p id="resetMessage" class="reset-message" role="status" aria-live="polite"></p>
            </form>

            <div class="reset-back"><a href="index.html">← Volver a Kantu Floral</a></div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
    <script src="js/supabase.js"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>
