name: Apply admin alert escalation

on:
  push:
    branches: [feat/admin-alert-escalation]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[alert-escalation-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/admin-alert-escalation
          fetch-depth: 0

      - name: Apply alert escalation
        run: python3 scripts/apply-admin-alert-escalation.py

      - name: Commit transformed sources
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/admin-growth.js css/kantu-growth.css scripts/check-kantu-growth.mjs
          git commit -m "Add Admin alert escalation controls [alert-escalation-applied]"
          git push origin HEAD:feat/admin-alert-escalation
