name: Apply Admin alert document delegation

on:
  push:
    branches: [feat/admin-alert-escalation]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[document-delegation-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-alert-escalation
          fetch-depth: 0
      - run: python3 scripts/apply-admin-alert-document-delegation.py
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/admin-growth.js
          git commit -m "Keep Admin alert actions alive through UI rebuilds [document-delegation-applied]"
          git push origin HEAD:feat/admin-alert-escalation
