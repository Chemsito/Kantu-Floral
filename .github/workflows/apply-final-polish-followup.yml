name: Apply final frontend polish follow-up

on:
  push:
    branches: [feat/final-frontend-polish]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[followup-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/final-frontend-polish
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply follow-up polish
        run: node scripts/apply-final-frontend-polish-followup.mjs

      - name: Commit transformed sources
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html staff.html css/final-polish.css
          git commit -m "Finish final frontend polish [followup-applied]"
          git push origin HEAD:feat/final-frontend-polish
