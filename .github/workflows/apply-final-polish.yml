name: Apply final frontend polish

on:
  push:
    branches: [feat/final-frontend-polish]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[polish-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/final-frontend-polish
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply deterministic polish
        run: node scripts/apply-final-frontend-polish.mjs

      - name: Commit transformed sources
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html producto.html staff.html reset-password.html js/auth.js js/product-detail.js package.json
          git commit -m "Apply final frontend polish [polish-applied]"
          git push origin HEAD:feat/final-frontend-polish
