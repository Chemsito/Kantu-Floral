name: Apply Admin alert first-click fix

on:
  push:
    branches: [feat/admin-alert-escalation]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[admin-first-click-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-alert-escalation
          fetch-depth: 0
      - run: python3 scripts/fix-admin-alert-first-click.py
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/admin-growth.js scripts/check-kantu-growth.mjs
          git commit -m "Fix Admin first-click audio race [admin-first-click-fixed]"
          git push origin HEAD:feat/admin-alert-escalation
