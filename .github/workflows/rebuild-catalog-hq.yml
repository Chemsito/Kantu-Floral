name: Rebuild catalog HQ images

on:
  push:
    branches: [fix/catalog-hq-images]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/catalog-hq-images
          fetch-depth: 0

      - name: Install image tools
        run: python -m pip install --quiet pymupdf pillow

      - name: Download original BLUME catalog
        shell: bash
        run: |
          set -euo pipefail
          HASH='4f92a49f88ecccf1f15c8b90c68b55229670e382'
          for host in cdnc.heyzine.com cdn.heyzine.com cdnm.heyzine.com; do
            url="https://${host}/files/uploaded/v2/${HASH}.pdf"
            echo "Trying ${url}"
            if curl -A 'Mozilla/5.0' -fL --retry 2 --connect-timeout 20 "$url" -o /tmp/blume.pdf; then
              break
            fi
          done
          test -s /tmp/blume.pdf
          file /tmp/blume.pdf | grep -qi PDF

      - name: Regenerate 96 high quality images
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io
          from pathlib import Path
          import fitz
          from PIL import Image

          specs = "3:top,3:bottom,4:top,4:bottom,5:top,5:bottom,6:top,6:bottom,7:top,7:bottom,9:top,9:bottom,10:top,10:bottom,11:top,11:bottom,12:top,12:bottom,13:top,13:bottom,14:top,14:bottom,15:single,16:top,16:bottom,17:top,17:bottom,18:top,18:bottom,19:top,19:bottom,20:top,20:bottom,21:top,21:bottom,22:top,22:bottom,23:top,23:bottom,24:top,24:bottom,25:top,25:bottom,26:top,26:bottom,27:top,27:bottom,28:sun_right,28:sun_mid,28:sun_right,28:sun_left,29:tul_mid,29:tul_left,29:tul_right,31:top,31:bottom,32:top,32:bottom,34:top,34:bottom,35:top,35:bottom,36:top,36:bottom,37:top,37:bottom,38:top,38:bottom,39:top,39:bottom,40:top,40:bottom,42:top,42:bottom,43:top,43:bottom,44:top,44:bottom,46:top,46:bottom,47:top,47:bottom,48:single48,50:teddy_small,50:teddy_medium,50:teddy_large,50:topper,50:topper,51:balloon_mini,51:balloon_small,51:balloon_large,51:bubble,53:top,53:bottom,54:top,54:bottom"
          specs = [(int(x.split(':',1)[0]), x.split(':',1)[1]) for x in specs.split(',')]
          assert len(specs) == 96

          boxes = {
              'top':(0.045,0.045,0.495,0.46),
              'bottom':(0.50,0.515,0.95,0.92),
              'single':(0.028,0.23,0.62,0.81),
              'single48':(0.04,0.27,0.53,0.70),
              'sun_left':(0.04,0.00,0.34,0.255),
              'sun_mid':(0.35,0.00,0.65,0.255),
              'sun_right':(0.66,0.00,0.96,0.255),
              'tul_left':(0.04,0.00,0.34,0.255),
              'tul_mid':(0.35,0.00,0.65,0.255),
              'tul_right':(0.66,0.00,0.96,0.255),
              'teddy_small':(0.10,0.24,0.27,0.40),
              'teddy_medium':(0.33,0.15,0.56,0.40),
              'teddy_large':(0.62,0.09,0.93,0.40),
              'topper':(0.07,0.64,0.57,0.91),
              'balloon_mini':(0.04,0.20,0.31,0.39),
              'balloon_small':(0.34,0.19,0.57,0.39),
              'balloon_large':(0.59,0.09,0.93,0.40),
              'bubble':(0.05,0.59,0.54,0.94),
          }

          out = Path('assets/catalog/blume-2026')
          out.mkdir(parents=True, exist_ok=True)
          doc = fitz.open('/tmp/blume.pdf')
          rendered = {}

          for index, (page_number, crop_name) in enumerate(specs, 1):
              if page_number not in rendered:
                  page = doc[page_number - 1]
                  pix = page.get_pixmap(matrix=fitz.Matrix(3, 3), alpha=False)
                  rendered[page_number] = Image.open(io.BytesIO(pix.tobytes('png'))).convert('RGB')
              image = rendered[page_number]
              w, h = image.size
              b = boxes[crop_name]
              crop = image.crop((int(b[0]*w), int(b[1]*h), int(b[2]*w), int(b[3]*h)))
              crop.thumbnail((900, 1125), Image.Resampling.LANCZOS)
              crop.save(out / f'{index:03d}.webp', 'WEBP', quality=90, method=6)

          files = sorted(out.glob('*.webp'))
          assert len(files) == 96, len(files)
          total = sum(p.stat().st_size for p in files)
          assert total > 2_500_000, total
          assert min(p.stat().st_size for p in files) > 8_000
          print(f'Generated {len(files)} HQ images, total={total/1024/1024:.2f} MB')
          PY

      - name: Commit HQ assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/rebuild-catalog-hq.yml
          git add assets/catalog/blume-2026 .github/workflows/rebuild-catalog-hq.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Assets: replace catalog images with HQ originals'
          git push origin HEAD:fix/catalog-hq-images
