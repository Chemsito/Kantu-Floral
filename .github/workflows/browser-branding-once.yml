name: Browser Branding Once

on:
  push:
    branches:
      - feat/browser-branding-assets

permissions:
  contents: write

jobs:
  branding:
    if: ${{ !contains(github.event.head_commit.message, '[branding-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/browser-branding-assets
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Generate Kantu browser branding and local logo assets
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import io, json, re, urllib.request

          root = Path('.')
          assets = root / 'assets' / 'brand'
          assets.mkdir(parents=True, exist_ok=True)

          brand_css_path = root / 'css' / 'brand.css'
          brand_css = brand_css_path.read_text(encoding='utf-8')
          match = re.search(r'background-image:\s*url\("(https://scontent[^\"]+)"\)', brand_css)
          if not match:
              raise SystemExit('No se encontró la URL de logo de Facebook en brand.css')

          logo_url = match.group(1).replace('&amp;', '&')
          request = urllib.request.Request(logo_url, headers={'User-Agent': 'Mozilla/5.0 KantuFloralBrandAssetMigration/1.0'})
          with urllib.request.urlopen(request, timeout=30) as response:
              source_bytes = response.read()
          source = Image.open(io.BytesIO(source_bytes)).convert('RGBA')
          w, h = source.size
          if min(w, h) < 600:
              raise SystemExit(f'Logo remoto demasiado pequeño: {w}x{h}')

          # Isotipo: flor central + aro dorado. Coordenadas proporcionales al logo maestro.
          crop = source.crop((
              round(w * 0.287),
              round(h * 0.151),
              round(w * 0.714),
              round(h * 0.578),
          ))
          mark = Image.new('RGBA', (600, 600), (255, 255, 255, 255))
          fitted = ImageOps.contain(crop, (540, 540), method=Image.Resampling.LANCZOS)
          mark.alpha_composite(fitted, ((600 - fitted.width) // 2, (600 - fitted.height) // 2))

          def save_png(name, size, colors=128):
              image = mark.resize((size, size), Image.Resampling.LANCZOS)
              rgb = Image.new('RGB', image.size, 'white')
              rgb.paste(image, mask=image.getchannel('A'))
              quantized = rgb.quantize(colors=colors, method=Image.Quantize.MEDIANCUT)
              quantized.save(assets / name, optimize=True)

          save_png('favicon-16x16.png', 16, 64)
          save_png('favicon-32x32.png', 32, 96)
          save_png('apple-touch-icon.png', 180)
          save_png('android-chrome-192x192.png', 192)
          save_png('android-chrome-512x512.png', 512)
          save_png('kantu-mark-512.png', 512)

          mark.save(assets / 'favicon.ico', format='ICO', sizes=[(16,16), (32,32), (48,48)])

          # Copia local controlada del logo completo para compartir enlaces y futuros usos de marca.
          source_rgb = Image.new('RGB', source.size, 'white')
          source_rgb.paste(source, mask=source.getchannel('A'))
          source_fit = ImageOps.contain(source_rgb, (1050, 1050), method=Image.Resampling.LANCZOS)
          source_fit.save(assets / 'kantu-logo.jpg', quality=88, optimize=True, progressive=True)

          og = Image.new('RGB', (1200, 630), (255, 250, 246))
          og_logo = ImageOps.contain(source_rgb, (620, 590), method=Image.Resampling.LANCZOS)
          og.paste(og_logo, ((1200 - og_logo.width) // 2, (630 - og_logo.height) // 2))
          og.save(assets / 'og-kantu-floral.jpg', quality=90, optimize=True, progressive=True)

          manifest = {
              'name': 'Kantu Floral | Flores que cuentan historias',
              'short_name': 'Kantu Floral',
              'start_url': './',
              'scope': './',
              'display': 'standalone',
              'background_color': '#fffaf6',
              'theme_color': '#c44762',
              'icons': [
                  {'src': 'assets/brand/android-chrome-192x192.png', 'sizes': '192x192', 'type': 'image/png'},
                  {'src': 'assets/brand/android-chrome-512x512.png', 'sizes': '512x512', 'type': 'image/png'}
              ]
          }
          (root / 'site.webmanifest').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          favicon_links = '''    <link rel="icon" href="assets/brand/favicon.ico" sizes="any">\n    <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32x32.png">\n    <link rel="icon" type="image/png" sizes="16x16" href="assets/brand/favicon-16x16.png">\n    <link rel="apple-touch-icon" sizes="180x180" href="assets/brand/apple-touch-icon.png">\n    <link rel="manifest" href="site.webmanifest">'''

          def add_branding_links(path):
              html = path.read_text(encoding='utf-8')
              if 'assets/brand/favicon.ico' not in html:
                  marker = re.search(r'(^\s*<meta name="theme-color"[^>]*>\s*$)', html, re.M)
                  if not marker:
                      raise SystemExit(f'No theme-color marker in {path}')
                  insert_at = marker.end()
                  html = html[:insert_at] + '\n' + favicon_links + html[insert_at:]
              path.write_text(html, encoding='utf-8')

          for html_name in ('index.html', 'producto.html', 'staff.html'):
              add_branding_links(root / html_name)

          # Social preview estable para la tienda; producto puede reemplazarlo dinámicamente por su foto real.
          index_path = root / 'index.html'
          index_html = index_path.read_text(encoding='utf-8')
          if 'property="og:image"' not in index_html:
              needle = '    <meta property="og:url" content="https://chemsito.github.io/Kantu-Floral/">'
              replacement = needle + '\n    <meta property="og:image" content="https://chemsito.github.io/Kantu-Floral/assets/brand/og-kantu-floral.jpg">'
              if needle not in index_html:
                  raise SystemExit('No se encontró og:url de index')
              index_html = index_html.replace(needle, replacement, 1)
          if 'name="twitter:image"' not in index_html:
              needle = '    <meta name="twitter:description" content="Ramos y arreglos florales con delivery en Arequipa.">'
              replacement = needle + '\n    <meta name="twitter:image" content="https://chemsito.github.io/Kantu-Floral/assets/brand/og-kantu-floral.jpg">'
              if needle not in index_html:
                  raise SystemExit('No se encontró twitter description de index')
              index_html = index_html.replace(needle, replacement, 1)
          index_path.write_text(index_html, encoding='utf-8')

          product_path = root / 'producto.html'
          product_html = product_path.read_text(encoding='utf-8')
          if 'property="og:image"' not in product_html:
              needle = '    <meta property="og:url" content="https://chemsito.github.io/Kantu-Floral/producto.html">'
              replacement = needle + '\n    <meta property="og:image" content="https://chemsito.github.io/Kantu-Floral/assets/brand/og-kantu-floral.jpg">'
              if needle not in product_html:
                  raise SystemExit('No se encontró og:url de producto')
              product_html = product_html.replace(needle, replacement, 1)
          if 'name="twitter:image"' not in product_html:
              needle = '    <meta name="twitter:description" content="Flores y regalos de Kantu Floral en Arequipa.">'
              replacement = needle + '\n    <meta name="twitter:image" content="https://chemsito.github.io/Kantu-Floral/assets/brand/og-kantu-floral.jpg">'
              if needle not in product_html:
                  raise SystemExit('No se encontró twitter description de producto')
              product_html = product_html.replace(needle, replacement, 1)
          product_path.write_text(product_html, encoding='utf-8')

          # El header deja de depender de Facebook/CDN y usa el isotipo controlado por Kantu.
          brand_css = brand_css_path.read_text(encoding='utf-8')
          brand_css = re.sub(
              r'background-image:\s*url\("https://scontent[^\"]+"\);',
              'background-image: url("../assets/brand/kantu-mark-512.png");',
              brand_css,
              count=1,
          )
          brand_css = brand_css.replace('background-size: 205%;', 'background-size: cover;')
          brand_css = brand_css.replace('background-position: center 23%;', 'background-position: center;')
          if 'scontent-' in brand_css:
              raise SystemExit('brand.css todavía referencia Facebook CDN')
          brand_css_path.write_text(brand_css, encoding='utf-8')

          # Contrato de identidad del navegador.
          check_path = root / 'scripts' / 'check-browser-branding.mjs'
          check_path.write_text('''import fs from "node:fs";\nimport assert from "node:assert/strict";\n\nconst index = fs.readFileSync("index.html", "utf8");\nconst product = fs.readFileSync("producto.html", "utf8");\nconst staff = fs.readFileSync("staff.html", "utf8");\nconst brand = fs.readFileSync("css/brand.css", "utf8");\nconst adminStandalone = fs.readFileSync("js/admin-standalone.js", "utf8");\nconst productDetail = fs.readFileSync("js/product-detail.js", "utf8");\nconst manifest = JSON.parse(fs.readFileSync("site.webmanifest", "utf8"));\n\nfor (const [name, html] of [["storefront", index], ["product", product], ["staff", staff]]) {\n  assert.match(html, /assets\\/brand\\/favicon\\.ico/, `${name} debe declarar favicon Kantu`);\n  assert.match(html, /apple-touch-icon/, `${name} debe declarar Apple Touch Icon`);\n  assert.match(html, /site\\.webmanifest/, `${name} debe declarar manifest`);\n}\nfor (const asset of [\n  "assets/brand/favicon.ico",\n  "assets/brand/favicon-16x16.png",\n  "assets/brand/favicon-32x32.png",\n  "assets/brand/apple-touch-icon.png",\n  "assets/brand/android-chrome-192x192.png",\n  "assets/brand/android-chrome-512x512.png",\n  "assets/brand/kantu-mark-512.png",\n  "assets/brand/kantu-logo.jpg",\n  "assets/brand/og-kantu-floral.jpg"\n]) assert.equal(fs.existsSync(asset), true, `Falta asset de marca: ${asset}`);\nassert.match(brand, /\.\.\\/assets\\/brand\\/kantu-mark-512\\.png/, "Header debe usar logo local");\nassert.doesNotMatch(brand, /scontent-|facebook.*jpg/i, "Header no debe depender de Facebook CDN");\nassert.match(adminStandalone, /Panel administrador \\| Kantu Floral/, "Admin standalone debe tener título propio");\nassert.match(productDetail, /document\.title = `\\$\\{row\.name\\} \\| Kantu Floral`/, "Producto debe usar título dinámico");\nassert.equal(manifest.short_name, "Kantu Floral");\nassert.equal(manifest.icons.length >= 2, true);\nassert.match(index, /og-kantu-floral\.jpg/, "Storefront debe tener Open Graph image local");\nassert.match(product, /og-kantu-floral\.jpg/, "Producto debe tener fallback Open Graph image local");\nconsole.log("Browser branding contracts OK");\n''', encoding='utf-8')

          package_path = root / 'package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          scripts = package.setdefault('scripts', {})
          if 'check:browser-branding' not in scripts:
              scripts['check:browser-branding'] = 'node scripts/check-browser-branding.mjs'
              scripts['check'] = scripts['check'] + ' && npm run check:browser-branding'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print('Brand assets:', sorted(p.name for p in assets.iterdir()))
          print('Logo source size:', source.size)
          PY

      - name: Commit generated branding
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brand site.webmanifest index.html producto.html staff.html css/brand.css scripts/check-browser-branding.mjs package.json
          git commit -m "Add Kantu browser branding and local logo assets [branding-applied]"
          git push origin HEAD:feat/browser-branding-assets
