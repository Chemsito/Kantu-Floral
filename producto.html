                    <span class="cart-count" id="cartCount" aria-live="polite">0</span>

                <button type="button" class="user-button" id="loginButton">Iniciar sesión</button>
                <button type="button" class="icon-button mobile-menu" aria-controls="siteNavigation" aria-expanded="false" aria-label="Abrir menú de navegación"><span aria-hidden="true"><svg class="kantu-source-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span></button>
